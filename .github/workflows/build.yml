# Builds the plugin and uploads the resulting zip as an artifact.
# Run manually from the "Actions" tab in GitHub.

name: Build Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: Build Rider Plugin
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: false

      - name: Build plugin
        run: .\gradlew.bat buildPlugin --build-cache --no-daemon

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rider-demystified-links
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
